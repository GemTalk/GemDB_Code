# Gitleaks configuration for the release pipeline's scan of the packaged .vsix.
#
# Open VSX runs its own gitleaks-based scan server-side, AFTER accepting an
# upload. A hit there leaves the package inactive or rejected — and by then the
# version number is spent,
# because both registries are immutable per (publisher, name, version,
# targetPlatform). Jasper has been bitten twice this way (1.7.6 and 1.8.3, both
# GemStone's *public* default password), each time failing only the Open VSX
# half after the Marketplace had already published. Scanning the packages
# ourselves, before anything is uploaded, turns that into a re-dispatch.
#
# Open VSX's publishing documentation now describes an inline suppression
# marker for a false positive, which it did not when those two rejections
# happened. Untested from here, and not a reason to relax this job: the marker
# has to sit on the flagged line, and the line that matters for GemDB is inside
# an esbuild bundle, where no source comment survives.
#
# The scan target is the UNZIPPED .vsix, not the working tree. The tree
# simultaneously misses what ships — `out/*.js`, `grail/` and `mcp/` are all in
# the package and none of them is in git — and floods on what does not. For
# GemDB the first half is nearly the whole payload, which is why scanning git
# would be close to scanning nothing.
#
# Measured over the real 1.4.0 package on 2026-09-11, 128 MB in 2.3 seconds:
# the default rules found 13 hits, every one of them inside the shipped extent.
# That package no longer exists — GemDB stopped shipping an extent — so the
# expected result was zero.
#
# Re-measured on the first 4.0 package, 1.5.0, on 2026-09-16: 33.7 MB in under
# a second, and one hit rather than none — the telemetry connection string,
# which arrived after this file was written and is allowlisted below. The
# expected result is now exactly that one allowlisted string and nothing else.

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# The shipped database: there is no longer one
# ---------------------------------------------------------------------------
# A path allowlist for `extent/gemdb.dbf` used to live here. GemDB shipped a
# prepared extent, and every GemStone extent carries key material the vendor
# put there — `examplePrivateKeyAsPem`, an RSA private key commented "Private
# key for the ssh test server at ssh-test.gemtalksystems.com", plus an OPENSSH
# key beside it — which GemDB neither wrote nor could remove. It was
# allowlisted by path rather than by text, because a text-matched allowlist for
# an 80 MB binary would have had to name a private key in a public repository.
#
# No extent is shipped now (see CLAUDE.md, "A release ships code to build a
# database"), so the allowlist is gone with it and the scan is blind to
# nothing. If a prepared database ever ships again, this is the reasoning to
# restore — and the question to re-ask, because what justified it was that
# Grail is scanned in source form in the same package.

# ---------------------------------------------------------------------------
# The form Open VSX actually rejects
# ---------------------------------------------------------------------------
# Restated explicitly because gitleaks' defaults do NOT flag it: a default scan
# over the real package sails straight past the exact failure this job exists
# to prevent. Open VSX runs rules the default set does not, and this is the one
# that has rejected a GemTalk extension.
#
# It is not decoration here either. Before the commit that precedes this one,
# it fired on two files GemDB was shipping — `grail/scripts/new_worktree.sh`
# (`CLAUDE_PASSWORD='swordfish'`) and `grail/scripts/create_claude_users.gs`.
# Those are now excluded from the package rather than allowlisted, which is the
# distinction that keeps this rule worth having.
[[rules]]
id = "gemstone-password-literal"
description = "A `password`-suffixed key assigned a short quoted literal — the form Open VSX's hashicorp-tf-password rule rejects"
regex = '''(?i)password\w*\s*[:=]\s*["'][A-Za-z0-9]{7,20}["']'''
tags = ["password", "open-vsx"]

# CPython's and Django's own source, carried verbatim as the Python runtime's
# standard library. The hits are field *names* and test fixtures —
# `password1_field_name="password1"`, `PASSWORD_FIELD = "password"`,
# `KEY_PASSWORD = "somepass"`, `load_cert_chain(..., password="badpass")` —
# identical in every CPython and Django distribution and not GemDB's to change.
#
# Scoped to this one custom rule and to that one directory, so a real key
# planted in the stdlib tree is still caught by `private-key` and everything
# else the defaults bring. Deliberately NOT allowlisted by secret text: the
# literals are ordinary words, and matching on them would suppress the same
# words anywhere in the package.
[[allowlists]]
description = "Password field names and test fixtures in the bundled CPython/Django standard library"
targetRules = ["gemstone-password-literal"]
paths = ['''grail/src/python/stdlib/''']

# The MCP server's own auth tests, which create a throwaway user:
# `AllUsers addNewUserWithId: aUserId password: 'swordfishXYZ'`. Upstream test
# sources for a code path GemDB deliberately does not file in — the payload is
# installed with `--no-auth`, because nothing in GemDB can start `McpAuthRouter`
# (CLAUDE.md, "The MCP payload must be filed in with `--grail`"). So this is
# test fixture text for classes that never reach a user's database.
#
# Allowlisted rather than excluded, unlike the two Grail development scripts
# this same rule caught. `bundle-mcp.sh` copies `src/` wholesale and then
# derives the rest of the payload from what the installers source, deliberately,
# so that a sourced file cannot be left out; pruning a subtree out of that is a
# different change with a different argument, and it would put `--auth` out of
# reach of anyone who later makes it startable. Scoped to that one directory and
# this one rule, so the defaults still apply there in full.
[[allowlists]]
description = "Test-fixture credentials in the MCP server's auth tests, which GemDB files in with --no-auth"
targetRules = ["gemstone-password-literal"]
paths = ['''mcp/src/auth/''']

# ---------------------------------------------------------------------------
# GemDB's own telemetry endpoint
# ---------------------------------------------------------------------------
# `generic-api-key` fires on the Application Insights connection string in
# `src/telemetry.ts`, which reaches the package inside `out/extension.js`. It
# was the one hit in all three 1.5.0 packages, and it stopped that release's
# second dispatch at `scan` after `validate` and `collect` had passed.
#
# It is allowlisted rather than removed because it is not a credential in the
# sense the rule means. An ingestion connection string says where events land;
# it cannot read telemetry back, cannot reach the resource that stores it, and
# grants nothing but the ability to send events to a firehose GemTalk owns. The
# worst a holder can do is pollute GemDB's own usage data. It is also already
# public -- it is committed in this repository, as it must be, since a client
# cannot report telemetry to an endpoint it does not carry.
#
# Scoped as narrowly as gitleaks allows: this one rule, and the one literal
# GUID, matched against the SECRET rather than the line. Deliberately no
# `paths` entry -- conditions inside an allowlist are OR'd, so naming
# `out/extension.js` here would exempt the whole bundle, which is the file most
# worth scanning. A different key, in this file or any other, still fails the
# release.
#
# One caveat this cannot settle: Open VSX's own detector may reach a different
# verdict, since it is not this rule set. If it ever rejects an upload over
# this string, the answer is not a looser rule here -- their publishing
# documentation describes an inline suppression marker, and the durable fix is
# to stop embedding the key in the bundle at all.
[[allowlists]]
description = "GemDB's own Application Insights ingestion connection string, which has to ship for telemetry to work"
targetRules = ["generic-api-key"]
regexes = ['''^933fff8d-f71d-4f13-b7dd-7fe6b5cceade$''']

# ---------------------------------------------------------------------------
# What this cannot do
# ---------------------------------------------------------------------------
# Stated plainly so the job is not mistaken for a guarantee. gitleaks matches
# TEXT, not program semantics, so every rule here is defeated by string
# concatenation — "sword" + "fish" never appears contiguously in a file. Two
# GemDB-specific blind spots are worth naming on top of that:
#
#   - `npm run bundle` minifies, so `DB_PASSWORD = 'swordfish'` reaches the
#     package as `V="swordfish"`. The identifier a password rule anchors on is
#     gone. That is why five releases have passed Open VSX's scan with the
#     database password in `out/extension.js`, and it is luck rather than
#     design: it protects the bundle and nothing else.
#
# That is acceptable because of what this job is FOR. It exists to predict Open
# VSX's server-side verdict before an upload burns a version number, and Open
# VSX runs the same class of regex scanner over the same package: a secret that
# evades these rules evades theirs too, so it does not cause the rejection this
# guards against. The control is calibrated to the failure it is meant to catch
# — an accidental commit, which is never obfuscated — not to a determined
# author, which no regex can stop.
#
# Deliberate smuggling is a different threat with different defences: code
# review, CI, and the release-approval gate. Do not answer it by loosening
# these rules. Each looser rule costs false positives, and a scan that cries
# wolf is a scan someone eventually disables — strictly worse than one with a
# known limit.
