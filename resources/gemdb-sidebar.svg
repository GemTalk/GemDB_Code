<?xml version="1.0" encoding="UTF-8"?>
<!--
  Activity-bar icon: GemDB_Icon.svg as a single-colour mask.

  VS Code treats an activity-bar icon as a mask and recolours it to match the
  theme, so the mark's two shades cannot survive as colours. They survive as
  alpha instead: the mask keeps opacity, so the right half carries the source's
  own 0.6 and reads as the lighter face whatever colour the theme paints it.
  The coordinates are GemDB_Icon.svg's own; the viewBox is widened to a square
  about the mark's centre.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -15.01 90.31 90.31" width="24" height="24">
  <path fill="currentColor" d="M45.15 0 0 30.14 45.15 60.29 Z"/>
  <path fill="currentColor" fill-opacity=".6" d="M45.15 0 90.31 30.14 45.15 60.29 Z"/>
</svg>
