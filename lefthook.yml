# Local git hooks. lefthook's own postinstall installs these on `npm install`
# unless CI is set, so they are on by default; `npm run hooks:uninstall`
# removes them and `npm run hooks:install` puts them back. CI's `checks` job
# is the real gate either way.
#
# The glob is `src/**.ts`, not `src/**/*.ts`: lefthook's `**` matches across
# separators but the trailing `/*.ts` then demands one, so `src/**/*.ts` would
# silently skip every file directly under src/ — measured, not assumed.
pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: 'src/**.ts'
      run: npx eslint --no-warn-ignored {staged_files}
    - name: prettier
      glob: 'src/**.ts'
      run: npx prettier --check {staged_files}

post-checkout:
  jobs:
    - name: warn-outdated-packages
      run: bash scripts/warn-outdated-packages.sh post-checkout {1} {2} {3}

post-merge:
  jobs:
    - name: warn-outdated-packages
      run: bash scripts/warn-outdated-packages.sh post-merge

post-rewrite:
  jobs:
    - name: warn-outdated-packages
      run: bash scripts/warn-outdated-packages.sh post-rewrite
